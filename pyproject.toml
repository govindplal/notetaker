[project]
name = "notetaker"
version = "0.1.0"
description = "Hosted lecture watcher that writes detailed bilingual notes"
readme = "README.md"
authors = [
    { name = "GOVIND P LAL", email = "govind.p.lal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "faster-whisper>=1.2.1",
    "imagehash>=4.3.2",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.27.0.42",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pydantic>=2.14.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines in prompts; ruff format handles code

[tool.pytest.ini_options]
testpaths = ["tests"]
