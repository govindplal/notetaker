[project]
name = "notetaker"
version = "0.1.0"
description = "Hosted lecture watcher that writes detailed bilingual notes"
readme = "README.md"
authors = [
    { name = "GOVIND P LAL", email = "govind.p.lal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
