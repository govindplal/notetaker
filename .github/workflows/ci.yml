name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (without the large CUDA wheels; the tests use a fake Whisper)
        run: uv sync --no-install-package nvidia-cublas-cu12 --no-install-package nvidia-cudnn-cu12
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
