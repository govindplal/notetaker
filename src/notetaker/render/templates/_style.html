<style>
  :root { color-scheme: light; --ivory: #FAF9F5; --slate: #141413; --clay: #D97757; --oat: #E3DACC; --olive: #788C5D; --sky: #6A8CAF;
          --gray-150: #F0EEE6; --gray-300: #D1CFC5; --gray-500: #87867F; --gray-700: #3D3D3A;
          --serif: ui-serif, Georgia, "Times New Roman", serif; --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ivory); color: var(--gray-700); font-family: var(--sans); font-size: 15px; line-height: 1.65;
         -webkit-font-smoothing: antialiased; padding: 56px 24px 120px; }
  .page { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 48px; }
  @media (max-width: 920px) { .page { grid-template-columns: 1fr; } nav { display: none; } }

  nav { position: sticky; top: 32px; align-self: start; font-size: 13px; max-height: calc(100vh - 64px); overflow: auto; }
  nav .label { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--gray-500); margin-bottom: 12px; }
  nav a { display: block; padding: 5px 0 5px 12px; border-left: 2px solid var(--gray-300); color: var(--gray-700); text-decoration: none; }
  nav a:hover { color: var(--slate); border-color: var(--slate); }

  header { margin-bottom: 12px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gray-500); margin-bottom: 10px; }
  .eyebrow a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--gray-300); }
  h1 { font-family: var(--serif); font-weight: 500; font-size: 32px; line-height: 1.25; color: var(--slate); letter-spacing: -.01em; margin-bottom: 14px; }
  .tldr { border: 1.5px solid var(--gray-300); border-left: 3px solid var(--clay); border-radius: 10px; background: #fff; padding: 16px 18px; margin-bottom: 8px; max-width: 720px; }
  .tldr b { color: var(--slate); }

  h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; color: var(--slate); margin: 40px 0 14px; scroll-margin-top: 24px; }
  .tag { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; color: var(--gray-500); margin: -6px 0 12px; max-width: 680px; }
  .tag b { color: var(--clay); font-weight: 500; }
  p { margin-bottom: 12px; max-width: 680px; }
  ul, ol { margin: 0 0 12px 20px; max-width: 680px; } li { margin-bottom: 5px; }
  code { font-family: var(--mono); font-size: 13px; }
  html { scroll-behavior: smooth; }

  .term { position: relative; border-bottom: 1.5px dotted var(--clay); cursor: help; color: var(--slate); }
  .term:hover::after { content: attr(data-def); position: absolute; left: 0; top: 100%; z-index: 5; width: max-content; max-width: 260px; margin-top: 6px;
                       background: var(--slate); color: #fff; font: 12.5px/1.5 var(--sans); padding: 8px 10px; border-radius: 8px; }

  .card { border: 1.5px solid var(--gray-300); border-radius: 10px; background: #fff; padding: 16px 18px; margin: 14px 0; max-width: 680px; }
  .card.wide { max-width: none; text-align: center; overflow-x: auto; }
  .card .label { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--gray-500); margin-bottom: 8px; }
  .card p:last-child { margin-bottom: 0; }
  .cap { font-size: 13px; color: var(--gray-500); max-width: 640px; margin: 4px 0 12px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; max-width: 680px; }
  @media (max-width: 640px) { .pair { grid-template-columns: 1fr; } }
  .pair .card { margin: 0; } .pair .good .label { color: var(--olive); } .pair .bad .label { color: rgb(176, 74, 63); }
  .canvas { border: 1.5px solid var(--gray-300); border-radius: 12px; background: var(--ivory); overflow: hidden; margin: 14px 0 6px; max-width: 720px; }
  .canvas svg { display: block; width: 100%; height: auto; }
  .canvas svg .m { font-family: var(--mono); font-size: 11px; } .canvas svg .s { font-family: var(--sans); font-size: 12px; }
  .canvas svg .t { font-family: var(--serif); font-size: 15px; } .canvas svg .b { font-weight: 600; }
  .formula { margin: 12px 0; max-width: 680px; overflow-x: auto; }

  details { border: 1.5px solid var(--gray-300); border-radius: 10px; background: #fff; margin: 14px 0; overflow: hidden; max-width: 680px; }
  summary { list-style: none; cursor: pointer; padding: 14px 16px; font-family: var(--serif); font-size: 16px; color: var(--slate); display: flex; align-items: baseline; gap: 10px; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸"; color: var(--clay); font-family: var(--sans); font-size: 12px; transition: transform 120ms; }
  details[open] summary::before { transform: rotate(90deg); }
  details .body { padding: 0 16px 16px; } details .body p { font-size: 14px; } details .body p:last-child { margin-bottom: 0; }

  .tabs { border: 1.5px solid var(--gray-300); border-radius: 10px; background: #fff; margin: 16px 0 8px; overflow: hidden; max-width: 680px; }
  .tabbar { display: flex; border-bottom: 1px solid var(--gray-300); background: var(--gray-150); }
  .tabbar button { appearance: none; border: none; background: none; font-family: var(--mono); font-size: 12px; color: var(--gray-500);
                   padding: 10px 16px; cursor: pointer; border-right: 1px solid var(--gray-300); }
  .tabbar button.on { background: #fff; color: var(--slate); border-bottom: 2px solid var(--clay); margin-bottom: -1px; }
  .tabs pre { display: none; margin: 0; padding: 16px 18px; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; color: var(--slate); overflow-x: auto; }
  .tabs pre.on { display: block; }

  .callout { display: flex; gap: 12px; border: 1.5px solid var(--oat); background: rgba(227, 218, 204, .35); border-radius: 10px; padding: 14px 16px; margin: 18px 0; font-size: 14px; max-width: 680px; }
  .callout .ico { color: var(--clay); font-weight: 600; } .callout p:last-child { margin-bottom: 0; }

  table { border-collapse: collapse; width: 100%; max-width: 640px; font-size: 13.5px; margin: 12px 0; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--gray-300); vertical-align: top; }
  th { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--gray-500); font-weight: 500; }

  dl.faq { margin-top: 8px; }
  dl.faq dt { font-family: var(--serif); font-size: 16px; color: var(--slate); margin-top: 18px; }
  dl.faq dd { font-size: 14px; margin: 4px 0 0; max-width: 640px; }

  .nav { display: flex; justify-content: space-between; margin-top: 48px; max-width: 680px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .nav a { color: var(--clay); text-decoration: none; }
</style>
